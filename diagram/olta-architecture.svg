<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Olta v1.0.0-Alpha architecture</title>
  <desc id="desc">Authorized purple-team flow across Olta Campaign, Olta Proxy, Olta Feed, target systems, optional redirector and future modules.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141d"/><stop offset="1" stop-color="#0b202b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#65c7df"/></marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#ff426f"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{fill:#f7fafc;font-size:30px;font-weight:700}.zoneTitle{font-size:17px;font-weight:700;letter-spacing:1.8px}.nodeTitle{fill:#fff;font-size:23px;font-weight:700}.nodeText{fill:#c8d7de;font-size:16px}.edgeText{fill:#d9f4fa;font-size:14px;font-weight:600}.planned{fill:#aebcc4;font-size:15px;font-weight:700;letter-spacing:1.5px}.futureTitle{fill:#eef4f6;font-size:20px;font-weight:700}.futureText{fill:#b8c6cc;font-size:15px}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1460" cy="95" r="180" fill="#e52f5d" opacity=".06"/><circle cx="120" cy="1020" r="230" fill="#45aeca" opacity=".06"/>
  <text x="800" y="60" text-anchor="middle" class="title">OLTA v1.0.0-Alpha • Authorized Purple Team Architecture</text>

  <rect x="55" y="115" width="410" height="720" rx="20" fill="#0a1c26" stroke="#2b728d" stroke-width="2"/>
  <text x="85" y="158" class="zoneTitle" fill="#8dd9ec">SIMULATION TARGET ENVIRONMENT</text>
  <g filter="url(#shadow)"><rect x="100" y="210" width="320" height="110" rx="14" fill="#173746" stroke="#4eaac4"/><rect x="100" y="405" width="320" height="110" rx="14" fill="#173746" stroke="#4eaac4"/><rect x="100" y="600" width="320" height="110" rx="14" fill="#173746" stroke="#4eaac4"/></g>
  <text x="125" y="250" class="nodeTitle">Target Devices</text><text x="125" y="282" class="nodeText">Browser • Mobile • Mail Client</text>
  <text x="125" y="445" class="nodeTitle">Defensive Controls</text><text x="125" y="477" class="nodeText">Firewall • EDR • SOC/SIEM</text>
  <text x="125" y="640" class="nodeTitle">Authorized Operator</text><text x="125" y="672" class="nodeText">Administration and monitoring</text>

  <rect x="520" y="115" width="1025" height="720" rx="20" fill="#0a1720" stroke="#e52f5d" stroke-width="2"/>
  <text x="550" y="158" class="zoneTitle" fill="#ff6a8d">AUTHORIZED OLTA INFRASTRUCTURE</text>
  <g filter="url(#shadow)">
    <rect x="575" y="205" width="400" height="155" rx="15" fill="#183141" stroke="#e52f5d" stroke-width="2"/>
    <rect x="575" y="500" width="400" height="175" rx="15" fill="#183141" stroke="#e52f5d" stroke-width="2"/>
    <rect x="1090" y="205" width="400" height="155" rx="15" fill="#183141" stroke="#e52f5d" stroke-width="2"/>
    <rect x="1090" y="445" width="400" height="130" rx="15" fill="#183141" stroke="#4eaac4"/>
    <rect x="1090" y="650" width="400" height="110" rx="15" fill="#183141" stroke="#4eaac4"/>
  </g>
  <text x="605" y="245" class="nodeTitle">olta-campaign</text><text x="605" y="280" class="nodeText">Campaign engine • Admin/API • Mail/SMS • QR</text><text x="605" y="312" class="nodeText">SQLite WAL or MySQL</text>
  <text x="605" y="540" class="nodeTitle">olta-proxy</text><text x="605" y="575" class="nodeText">AiTM reverse proxy • phishlets • lures</text><text x="605" y="607" class="nodeText">TLS certificates • BuntDB session store</text>
  <text x="1120" y="245" class="nodeTitle">olta-feed</text><text x="1120" y="280" class="nodeText">WebSocket live event stream</text><text x="1120" y="312" class="nodeText">Bounded client queue • Browser UI</text>
  <text x="1120" y="485" class="nodeTitle">Optional Redirector / Turnstile</text><text x="1120" y="520" class="nodeText">Blocked traffic • Challenge flow</text>
  <text x="1120" y="690" class="nodeTitle">Legitimate Origin Website</text><text x="1120" y="722" class="nodeText">Upstream content and authentication</text>

