  <path d="M975 280H1090" fill="none" stroke="#ff426f" stroke-width="3" marker-end="url(#arrowPink)"/><text x="1032" y="264" text-anchor="middle" class="edgeText">events</text>
  <path d="M975 545Q1030 545 1030 355Q1030 300 1090 300" fill="none" stroke="#ff426f" stroke-width="3" marker-end="url(#arrowPink)"/><rect x="970" y="374" width="160" height="27" rx="7" fill="#07141d"/><text x="1050" y="393" text-anchor="middle" class="edgeText">captured sessions</text>
  <path d="M975 575H1090" fill="none" stroke="#65c7df" stroke-width="3" marker-end="url(#arrowCyan)"/><text x="1032" y="563" text-anchor="middle" class="edgeText">blocked</text>
  <path d="M975 625Q1030 625 1030 705H1090" fill="none" stroke="#65c7df" stroke-width="3" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/><rect x="952" y="655" width="140" height="27" rx="7" fill="#07141d"/><text x="1022" y="674" text-anchor="middle" class="edgeText">proxied HTTPS</text>

  <text x="55" y="890" class="planned">PLANNED INTEGRATION POINTS</text>
  <g fill="#0d2430" stroke="#899aa4" stroke-width="2" stroke-dasharray="9 7"><rect x="55" y="925" width="440" height="120" rx="15"/><rect x="580" y="925" width="440" height="120" rx="15"/><rect x="1105" y="925" width="440" height="120" rx="15"/></g>
  <text x="85" y="970" class="futureTitle">uTLS</text><text x="85" y="1005" class="futureText">Proxy transport • JA3/JA4 shaping</text>
  <text x="610" y="970" class="futureTitle">Quishing</text><text x="610" y="1005" class="futureText">Dynamic QR campaign engine</text>
  <text x="1135" y="970" class="futureTitle">ASN Cloaking</text><text x="1135" y="1005" class="futureText">Proxy bot-detection middleware</text>
</svg>
