  <rect x="432" y="372" width="127" height="27" rx="7" fill="#07141d"/><text x="495" y="391" text-anchor="middle" class="edgeText">simulation traffic</text>
  <path d="M420 655H500Q530 655 530 625V290Q530 275 575 275" fill="none" stroke="#65c7df" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="475" y="692" text-anchor="middle" class="edgeText">Admin/API</text>
