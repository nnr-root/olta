<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Olta live feed</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <base href="/" />
    <link rel="stylesheet" href="/css/bulma.min.css">
    <link rel="stylesheet" href="/css/olta-feed.css">
  <body>
      <section class="section">
          <div class="container">
       <h1 class="notification is-info">Olta live feed<div id="audio-control" class="muted">Unmute</div></h1>
       <div id="connection-status" class="notification is-light">Connecting…</div>
       <form id="token-form" class="box" hidden>
         <label class="label" for="viewer-token">Viewer token</label>
         <div class="field has-addons">
           <div class="control is-expanded">
             <input id="viewer-token" class="input" type="password" autocomplete="current-password" required>
           </div>
           <div class="control">
             <button class="button is-info" type="submit">Connect</button>
           </div>
         </div>
         <p class="help">The token is kept only for this browser tab.</p>
       </form>
<div class="columns">
  <div class="column is-7">
    <div id="feed">
    </div>
  </div>
</div>
          </div>
       </section>
  </body>
  <script src="/js/app.js"></script>
</html>
